<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TP3 - Formulaire Bootstrap</title>

  <!-- Bootstrap 5.1.3 : fichiers téléchargés dans le projet -->
  <link rel="stylesheet" href="css/bootstrap.css">
  <script src="js/bootstrap.bundle.js"></script>
  <script src="js/form-validation.js"></script>
</head>
<body class="bg-light">
  <!-- Tout le contenu HTML du TP se trouve dans cette .container -->
  <div class="container py-5">
    <div class="row justify-content-center">
      <div class="col-lg-9 col-xl-8">
        <h1 class="mb-4 text-center">TP3 : Formulaire avec Bootstrap</h1>

        <div class="card shadow-sm">
          <div class="card-body p-4">
            <p class="text-muted mb-4">Remplissez tous les champs du formulaire.</p>

            <!-- novalidate laisse JavaScript gérer les erreurs et afficher la modal -->
            <form id="registrationForm" novalidate>
              <div class="row mb-3">
                <label for="name" class="col-sm-4 col-form-label">Nom</label>
                <div class="col-sm-8">
                  <input type="text" class="form-control" id="name" name="name" placeholder="Votre nom">
                </div>
              </div>

              <div class="row mb-3">
                <label for="firstname" class="col-sm-4 col-form-label">Prénom</label>
                <div class="col-sm-8">
                  <input type="text" class="form-control" id="firstname" name="firstname" placeholder="Votre prénom">
                </div>
              </div>

              <div class="row mb-3">
                <label for="birthday" class="col-sm-4 col-form-label">Date de naissance</label>
                <div class="col-sm-8">
                  <input type="date" class="form-control" id="birthday" name="birthday">
                </div>
              </div>

              <div class="row mb-3">
                <label for="address" class="col-sm-4 col-form-label">Adresse postale</label>
                <div class="col-sm-8">
                  <input type="text" class="form-control" id="address" name="address" placeholder="Ex. 10 rue de la République">
                </div>
              </div>

              <div class="row mb-3">
                <label for="city" class="col-sm-4 col-form-label">Ville</label>
                <div class="col-sm-8">
                  <input type="text" class="form-control" id="city" name="city" placeholder="Ex. Paris">
                  <div class="form-text">La ville servira à créer le lien Google Maps.</div>
                </div>
              </div>

              <div class="row mb-4">
                <label for="email" class="col-sm-4 col-form-label">Adresse e-mail</label>
                <div class="col-sm-8">
                  <input type="email" class="form-control" id="email" name="email" placeholder="exemple@domaine.fr">
                </div>
              </div>

              <div class="row">
                <div class="offset-sm-4 col-sm-8">
                  <button type="submit" class="btn btn-primary" id="submit">Valider</button>
                </div>
              </div>
            </form>
          </div>
        </div>
      </div>
    </div>

    <!-- Même modal pour les erreurs et pour le résultat valide -->
    <div class="modal fade" id="myModal" tabindex="-1" aria-labelledby="modalTitle" aria-hidden="true">
      <div class="modal-dialog">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title" id="modalTitle">Validation du formulaire</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Fermer"></button>
          </div>
          <div class="modal-body" id="modalBody"></div>
          <div class="modal-footer">
            <button type="button" class="btn btn-primary" data-bs-dismiss="modal">OK</button>
          </div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
